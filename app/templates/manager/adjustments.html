{% extends "base.html" %}
{% block title %}Запросы на корректировку{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Запросы на корректировку</h3>
    <div>
        <button class="btn btn-sm btn-secondary" id="refreshBtn">Обновить</button>
    </div>
</div>
<div class="table-responsive">
    <table class="table table-striped" id="requestsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ученик</th>
                <th>Тип</th>
                <th>Сумма</th>
                <th>Причина</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadRequests(){
    const res = await fetch('/manager/api/adjustment-requests');
    if (!res.ok) return alert('Ошибка загрузки');
    const data = await res.json();
    const tbody = document.querySelector('#requestsTable tbody');
    tbody.innerHTML = '';
    data.forEach(r=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${r.id}</td>
            <td>${r.student_name || r.student_id}</td>
            <td>${r.type}</td>
            <td>${r.amount}</td>
            <td>${r.reason || ''}</td>
            <td>${r.status}</td>
            <td>
                ${r.status === 'pending' ? `<div class="btn-group" role="group"><button class="btn btn-sm btn-success" data-id="${r.id}" data-action="approve">Одобрить</button><button class="btn btn-sm btn-danger" data-id="${r.id}" data-action="reject">Отклонить</button></div>` : ''}
            </td>
        `;
        tbody.appendChild(tr);
    });
}

document.addEventListener('DOMContentLoaded', ()=>{
    loadRequests();
    document.getElementById('refreshBtn').addEventListener('click', loadRequests);
    document.getElementById('requestsTable').addEventListener('click', async (e)=>{
        const btn = e.target.closest('button');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        if (action === 'approve'){
            const res = await fetch(`/manager/api/adjustment-requests/${id}/approve`, {method: 'POST'});
            if (res.ok) { await loadRequests(); } else { const err = await res.json(); alert(err.error || 'Ошибка'); }
        }
        if (action === 'reject'){
            const res = await fetch(`/manager/api/adjustment-requests/${id}/reject`, {method: 'POST'});
            if (res.ok) { await loadRequests(); } else { const err = await res.json(); alert(err.error || 'Ошибка'); }
        }
    });
});
</script>
{% endblock %}
