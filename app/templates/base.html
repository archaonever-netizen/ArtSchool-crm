<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ArtSchool CRM - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">ArtSchool CRM</a>
            {% if session.role %}
            <div class="d-flex align-items-center gap-3">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-light position-relative" id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-bell"></i>
                        <span id="notificationBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">0</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end p-2" aria-labelledby="notificationDropdown" style="min-width: 320px;">
                        <li class="d-flex justify-content-between align-items-center mb-2">
                            <strong class="me-auto">Уведомления</strong>
                            <button class="btn btn-sm btn-link" id="markAllReadButton" type="button">Прочитать все</button>
                        </li>
                        <li><div id="notificationList" class="list-group"></div></li>
                        <li><div id="notificationEmpty" class="text-muted small mt-2">Нет новых уведомлений.</div></li>
                    </ul>
                </div>
                <div class="text-light small">{{ session.role | capitalize }} | <a href="/auth/logout" class="text-light">Выход</a></div>
            </div>
            {% endif %}
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
    <script>
        async function loadNotifications() {
            const badge = document.getElementById('notificationBadge');
            const list = document.getElementById('notificationList');
            const empty = document.getElementById('notificationEmpty');
            if (!badge || !list) return;
            try {
                const response = await fetch('/notifications/');
                if (!response.ok) return;
                const items = await response.json();
                const unread = items.filter(item => !item.read).length;
                badge.textContent = unread;
                badge.style.display = unread > 0 ? 'inline-flex' : 'none';
                list.innerHTML = items.slice(0, 8).map(item => `
                    <button type="button" class="list-group-item list-group-item-action ${item.read ? '' : 'list-group-item-warning'} text-start" data-id="${item.id}">
                        <div class="d-flex w-100 justify-content-between">
                            <p class="mb-1 small text-dark">${item.message}</p>
                        </div>
                        <small class="text-muted">${new Date(item.created_at).toLocaleString('ru-RU')}</small>
                    </button>
                `).join('');
                empty.style.display = items.length === 0 ? 'block' : 'none';
            } catch (error) {
                console.error('Notification load failed', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();
            const markAll = document.getElementById('markAllReadButton');
            if (markAll) {
                markAll.addEventListener('click', async () => {
                    await fetch('/notifications/read', { method: 'POST' });
                    await loadNotifications();
                });
            }
        });
    </script>
</body>
</html>
