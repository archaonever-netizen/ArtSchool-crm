{% extends "base.html" %}
{% block title %}Платежи{% endblock %}
{% block content %}
<h1 class="mb-4">Платежи</h1>
<div class="mb-3">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#paymentModal">Добавить платеж</button>
</div>
<table class="table table-striped" id="paymentsTable">
    <thead>
        <tr><th>ID</th><th>Тип</th><th>Сумма</th><th>Описание</th><th>Дата</th><th>Создал</th><th>Действия</th></tr>
    </thead>
    <tbody></tbody>
</table>

<!-- Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить платеж</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="paymentForm">
          <div class="mb-3">
            <label class="form-label">Тип</label>
            <select name="type" class="form-select">
              <option value="income">Доход</option>
              <option value="expense">Расход</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Сумма</label>
            <input name="amount" type="number" step="0.01" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Описание</label>
            <input name="description" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Дата</label>
            <input name="date" type="date" class="form-control">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        <button type="button" class="btn btn-primary" id="savePaymentBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
async function loadPayments(){
    const res = await fetch('/admin/api/payments');
    const data = await res.json();
    const tbody = document.querySelector('#paymentsTable tbody');
    tbody.innerHTML='';
    data.forEach(p=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${p.id}</td><td>${p.type}</td><td>${p.amount}</td><td>${p.description||''}</td><td>${p.date}</td><td>${p.created_by_name||''}</td><td><button class="btn btn-sm btn-danger" onclick="deletePayment(${p.id})">Удалить</button></td>`;
        tbody.appendChild(tr);
    });
}

async function deletePayment(id){
    if(!confirm('Удалить платеж?')) return;
    await fetch('/admin/api/payments/'+id, {method:'DELETE'});
    loadPayments();
}

document.getElementById('savePaymentBtn').addEventListener('click', async ()=>{
    const form = document.getElementById('paymentForm');
    const fd = new FormData(form);
    const body = {};
    fd.forEach((v,k)=>body[k]=v);
    const res = await fetch('/admin/api/payments', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(res.ok){
        var modalEl = document.getElementById('paymentModal');
        var modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();
        loadPayments();
    } else {
        alert('Ошибка');
    }
});

loadPayments();
</script>
{% endblock %}
