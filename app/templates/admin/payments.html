{% extends "base.html" %}
{% block title %}Платежи{% endblock %}
{% block content %}
<div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:18px;">
    <div>
        <p class="label-small">Администратор</p>
        <h1 class="section-title">Платежи</h1>
    </div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#paymentModal">Добавить платеж</button>
</div>
<div class="floating-list" id="paymentsList"></div>
<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title">Добавить платеж</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="paymentForm" style="display:grid; gap:18px;">
          <div>
            <label class="label-small">Тип</label>
            <select name="type" class="input-field">
              <option value="income">Доход</option>
              <option value="expense">Расход</option>
            </select>
          </div>
          <div>
            <label class="label-small">Сумма</label>
            <input name="amount" type="number" step="0.01" class="input-field" required>
          </div>
          <div>
            <label class="label-small">Описание</label>
            <input name="description" class="input-field">
          </div>
          <div>
            <label class="label-small">Дата</label>
            <input name="date" type="date" class="input-field">
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        <button type="button" class="btn btn-primary" id="savePaymentBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadPayments(){
    const res = await fetch('/admin/api/payments');
    const data = await res.json();
    const container = document.getElementById('paymentsList');
    container.innerHTML='';
    data.forEach(p=>{
        const item = document.createElement('div');
        item.className = 'floating-row';
        item.innerHTML = `
            <div class="row-meta"><p class="row-title">${p.type === 'income' ? 'Доход' : 'Расход'} · ${p.created_by_name || ''}</p><p class="row-subtitle">${p.description || 'Без описания'} · ${p.date}</p></div>
            <div class="row-actions"><button class="btn btn-secondary btn-sm" onclick="deletePayment(${p.id})">Удалить</button></div>
        `;
        container.appendChild(item);
    });
}
async function deletePayment(id){
    if(!confirm('Удалить платеж?')) return;
    await fetch('/admin/api/payments/'+id, {method:'DELETE'});
    loadPayments();
}
document.getElementById('savePaymentBtn').addEventListener('click', async ()=>{
    const form = document.getElementById('paymentForm');
    const fd = new FormData(form);
    const body = {};
    fd.forEach((v,k)=>body[k]=v);
    const res = await fetch('/admin/api/payments', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(res.ok){
        bootstrap.Modal.getInstance(document.getElementById('paymentModal')).hide();
        loadPayments();
    } else {
        alert('Ошибка');
    }
});
loadPayments();
</script>
{% endblock %}
