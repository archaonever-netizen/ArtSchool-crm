{% extends "base.html" %}
{% block title %}Администратор{% endblock %}
{% block content %}
<h1 class="mb-4">Панель администратора</h1>
<div class="row g-3">
    <div class="col-md-4">
        <a href="/admin/students" class="text-decoration-none">
            <div class="card p-4 text-center">
                <i class="bi bi-people display-4 text-primary"></i>
                <h5 class="mt-2">Ученики</h5>
                <p class="text-muted">Управление учениками, тарифами и остатками</p>
            </div>
        </a>
    </div>
    <div class="col-md-4">
        <a href="/admin/schedule" class="text-decoration-none">
            <div class="card p-4 text-center">
                <i class="bi bi-calendar-week display-4 text-primary"></i>
                <h5 class="mt-2">Расписание</h5>
                <p class="text-muted">График занятий и посещаемость</p>
            </div>
        </a>
    </div>
    <div class="col-md-4">
        <a href="#" class="text-decoration-none disabled">
            <div class="card p-4 text-center opacity-50">
                <i class="bi bi-cash-stack display-4 text-primary"></i>
                <h5 class="mt-2">Платежи</h5>
                <p class="text-muted">Финансовые операции (скоро)</p>
            </div>
        </a>
    </div>
    <!-- Добавьте аналогичные карточки для остальных разделов -->
</div>
{% endblock %}
