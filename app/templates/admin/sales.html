{% extends 'base.html' %}
{% block title %}Продажи / Воронка{% endblock %}
{% block content %}
<div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:18px;">
    <div>
        <p class="label-small">Администратор</p>
        <h1 class="section-title">Продажи / Воронка</h1>
    </div>
    <button class="btn btn-primary" id="addSaleBtn">Добавить сделку</button>
</div>
<div class="split-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div class="section-card" id="leadColumn"><h3>Lead</h3></div>
    <div class="section-card" id="negotiationColumn"><h3>Negotiation</h3></div>
    <div class="section-card" id="soldColumn"><h3>Sold</h3></div>
</div>
<div class="modal fade" id="saleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="saleModalTitle">Добавить сделку</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="saleForm" style="display:grid; gap:18px;">
            <input type="hidden" id="saleId">
            <div>
                <label class="label-small">Имя контакта</label>
                <input type="text" id="saleContactName" class="input-field" required>
            </div>
            <div>
                <label class="label-small">Телефон</label>
                <input type="text" id="salePhone" class="input-field" required>
            </div>
            <div>
                <label class="label-small">Статус</label>
                <select id="saleStatus" class="input-field"><option value="lead">lead</option><option value="negotiation">negotiation</option><option value="sold">sold</option></select>
            </div>
            <div>
                <label class="label-small">Заметки</label>
                <textarea id="saleNotes" class="input-field" rows="4"></textarea>
            </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" id="saveSaleBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="soldSuccessModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title">Ученик создан</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body"><div id="soldSuccessMessage"></div></div>
      <div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const STATUS_ORDER = ['lead','negotiation','sold'];
async function fetchSales(){
    const res = await fetch('/admin/api/sales');
    if (!res.ok) return [];
    return await res.json();
}
function createSaleCard(sale){
    const card = document.createElement('div');
    card.className = 'floating-row';
    card.dataset.id = sale.id;
    const nextLabel = sale.status === 'lead' ? 'Negotiation' : sale.status === 'negotiation' ? 'Sold' : '';
    card.innerHTML = `
        <div class="row-meta"><p class="row-title">${sale.contact_name}</p><p class="row-subtitle">${sale.phone} · ${sale.notes || 'Без заметок'}</p></div>
        <div class="row-actions">
            <button class="btn btn-secondary btn-sm" data-action="edit" data-id="${sale.id}">Ред.</button>
            <button class="btn btn-secondary btn-sm" data-action="delete" data-id="${sale.id}">Удалить</button>
            ${nextLabel ? `<button class="btn btn-primary btn-sm" data-action="next" data-id="${sale.id}">Перевести в ${nextLabel}</button>` : ''}
        </div>
    `;
    return card;
}
async function renderSalesBoard(){
    const sales = await fetchSales();
    const lead = document.getElementById('leadColumn');
    const neg = document.getElementById('negotiationColumn');
    const sold = document.getElementById('soldColumn');
    lead.innerHTML = '<h3>Lead</h3>';
    neg.innerHTML = '<h3>Negotiation</h3>';
    sold.innerHTML = '<h3>Sold</h3>';
    sales.forEach(sale=>{
        const card = createSaleCard(sale);
        if (sale.status === 'lead') lead.appendChild(card);
        else if (sale.status === 'negotiation') neg.appendChild(card);
        else sold.appendChild(card);
    });
}
function openSaleModal(sale=null){
    document.getElementById('saleModalTitle').textContent = sale ? 'Редактировать сделку' : 'Добавить сделку';
    document.getElementById('saleId').value = sale ? sale.id : '';
    document.getElementById('saleContactName').value = sale ? sale.contact_name : '';
    document.getElementById('salePhone').value = sale ? sale.phone : '';
    document.getElementById('saleStatus').value = sale ? sale.status : 'lead';
    document.getElementById('saleNotes').value = sale ? sale.notes || '' : '';
    new bootstrap.Modal(document.getElementById('saleModal')).show();
}
async function saveSale(){
    const id = document.getElementById('saleId').value;
    const payload = {
        contact_name: document.getElementById('saleContactName').value,
        phone: document.getElementById('salePhone').value,
        status: document.getElementById('saleStatus').value,
        notes: document.getElementById('saleNotes').value
    };
    if (!payload.contact_name || !payload.phone) return alert('Имя и телефон обязательны');
    const url = id ? `/admin/api/sales/${id}` : '/admin/api/sales';
    const method = id ? 'PATCH' : 'POST';
    const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (!res.ok) { const error = await res.json(); return alert(error.error || 'Ошибка'); }
    const data = await res.json();
    bootstrap.Modal.getInstance(document.getElementById('saleModal')).hide();
    if (data.student || data.message) {
        document.getElementById('soldSuccessMessage').textContent = data.student ? `Ученик создан: ${data.student.full_name} (${data.student.phone})` : data.message;
        new bootstrap.Modal(document.getElementById('soldSuccessModal')).show();
    }
    await renderSalesBoard();
}
async function updateSaleStatus(id, nextStatus){
    const res = await fetch(`/admin/api/sales/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status: nextStatus }) });
    if (!res.ok) { const error = await res.json(); return alert(error.error || 'Ошибка'); }
    const data = await res.json();
    if (data.student || data.message) {
        document.getElementById('soldSuccessMessage').textContent = data.student ? `Ученик создан: ${data.student.full_name} (${data.student.phone})` : data.message;
        new bootstrap.Modal(document.getElementById('soldSuccessModal')).show();
    }
    await renderSalesBoard();
}
async function deleteSale(id){
    if (!confirm('Удалить сделку?')) return;
    await fetch(`/admin/api/sales/${id}`, { method:'DELETE' });
    await renderSalesBoard();
}
document.addEventListener('DOMContentLoaded', async ()=>{
    await renderSalesBoard();
    document.getElementById('addSaleBtn').addEventListener('click', ()=>openSaleModal());
    document.getElementById('saveSaleBtn').addEventListener('click', saveSale);
    document.querySelector('.split-grid').addEventListener('click', async (event)=>{
        const button = event.target.closest('button');
        if (!button) return;
        const id = button.dataset.id;
        const action = button.dataset.action;
        if (action === 'edit') {
            const res = await fetch(`/admin/api/sales/${id}`);
            if (!res.ok) return alert('Сделка не найдена');
            const sale = await res.json();
            openSaleModal(sale);
        }
        if (action === 'delete') await deleteSale(id);
        if (action === 'next') {
            const response = await fetch(`/admin/api/sales/${id}`);
            if (!response.ok) return;
            const sale = await response.json();
            const nextIndex = STATUS_ORDER.indexOf(sale.status) + 1;
            if (nextIndex < STATUS_ORDER.length) await updateSaleStatus(id, STATUS_ORDER[nextIndex]);
        }
    });
});
</script>
{% endblock %}
