{% extends "base.html" %}
{% block title %}Регламенты{% endblock %}
{% block content %}
<div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:18px;">
    <div>
        <p class="label-small">Администратор</p>
        <h1 class="section-title">Регламенты</h1>
    </div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#regModal">Добавить регламент</button>
</div>
<div class="floating-list" id="regsList"></div>
<div class="modal fade" id="regModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title">Регламент</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="regForm" style="display:grid; gap:18px;">
          <div>
            <label class="label-small">Заголовок</label>
            <input name="title" class="input-field" required>
          </div>
          <div>
            <label class="label-small">Содержимое</label>
            <textarea name="content" rows="10" class="input-field"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        <button type="button" class="btn btn-primary" id="saveRegBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadRegs(){
    const res = await fetch('/admin/api/regulations');
    const data = await res.json();
    const el = document.getElementById('regsList');
    el.innerHTML = '';
    data.forEach(r=>{
        const item = document.createElement('div');
        item.className = 'floating-row';
        item.innerHTML = `
            <div class="row-meta"><p class="row-title">${r.title}</p><p class="row-subtitle">${new Date(r.updated_at).toLocaleDateString('ru-RU')} · ${r.content ? r.content.substring(0,120) : ''}</p></div>
            <div class="row-actions"><button class="btn btn-secondary btn-sm" onclick="deleteReg(${r.id})">Удалить</button></div>
        `;
        el.appendChild(item);
    });
}
async function deleteReg(id){
    if(!confirm('Удалить регламент?')) return;
    await fetch('/admin/api/regulations/'+id, {method:'DELETE'});
    loadRegs();
}
document.getElementById('saveRegBtn').addEventListener('click', async ()=>{
    const form = document.getElementById('regForm');
    const fd = new FormData(form);
    const body = {};
    fd.forEach((v,k)=>body[k]=v);
    const res = await fetch('/admin/api/regulations', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(res.ok){
        bootstrap.Modal.getInstance(document.getElementById('regModal')).hide();
        loadRegs();
    } else { alert('Ошибка'); }
});
loadRegs();
</script>
{% endblock %}
