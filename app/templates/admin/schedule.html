{% extends 'base.html' %}
{% block title %}Расписание{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Расписание занятий</h3>
    <div>
        <button class="btn btn-primary" id="refreshCalendar">Обновить</button>
    </div>
</div>
<div id="calendar"></div>

<!-- Modal -->
<div class="modal fade" id="lessonModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lessonModalTitle">Создать занятие</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="lessonForm">
            <input type="hidden" id="lessonId">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Название</label>
                    <input class="form-control" id="lessonTitle">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Преподаватель</label>
                    <select id="teacherSelect" class="form-select"></select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Начало (ISO)</label>
                    <input class="form-control" id="lessonStart" type="datetime-local">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Конец (ISO)</label>
                    <input class="form-control" id="lessonEnd" type="datetime-local">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Макс. учеников</label>
                <input class="form-control" id="lessonMax" type="number" value="10">
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-danger" id="deleteLessonBtn" style="display:none">Удалить</button>
        <button type="button" class="btn btn-primary" id="saveLessonBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>
let calendar;
async function fetchTeachers(){
    // simple fetch from /admin/api/teachers if exists; fallback to building from Teacher model by API not present -> call /admin/api/teachers if implemented
    try{
        const res = await fetch('/admin/api/teachers');
        if (res.ok){
            return await res.json();
        }
    }catch(e){ }
    return [];
}

async function loadCalendar(){
    const calendarEl = document.getElementById('calendar');
    const events = (await fetch('/admin/api/lessons')).json();
    const teachers = await fetchTeachers();

    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        selectable: true,
        editable: false,
        events: async function(fetchInfo, successCallback, failureCallback){
            try{
                const res = await fetch('/admin/api/lessons');
                const data = await res.json();
                successCallback(data.map(item=>({id:item.id,title:item.title,start:item.start,end:item.end,extendedProps:{teacher_id:item.teacher_id}})));
            }catch(e){failureCallback(e)}
        },
        select: function(info){
            openLessonModal({start: info.startStr, end: info.endStr});
        },
        eventClick: async function(info){
            const id = info.event.id;
            // fetch lesson details
            const res = await fetch('/admin/api/lesson/' + id);
            if (!res.ok) return alert('Ошибка загрузки занятия');
            const lesson = await res.json();
            openLessonModal(lesson);
        }
    });
    calendar.render();
}

function openLessonModal(data){
    const modal = new bootstrap.Modal(document.getElementById('lessonModal'));
    document.getElementById('lessonId').value = data.id || '';
    document.getElementById('lessonTitle').value = data.title || '';
    if (data.start){
        // convert ISO to local datetime-local value
        document.getElementById('lessonStart').value = data.start.substring(0,16);
    } else document.getElementById('lessonStart').value = '';
    if (data.end){
        document.getElementById('lessonEnd').value = data.end.substring(0,16);
    } else document.getElementById('lessonEnd').value = '';
    document.getElementById('lessonMax').value = data.max_students || 10;
    document.getElementById('deleteLessonBtn').style.display = data.id ? 'inline-block' : 'none';
    modal.show();
}

document.addEventListener('DOMContentLoaded', async ()=>{
    await loadCalendar();
    document.getElementById('refreshCalendar').addEventListener('click', ()=> calendar.refetchEvents());

    const saveBtn = document.getElementById('saveLessonBtn');
    saveBtn.addEventListener('click', async ()=>{
        const id = document.getElementById('lessonId').value;
        const payload = {
            title: document.getElementById('lessonTitle').value,
            datetime_start: document.getElementById('lessonStart').value,
            datetime_end: document.getElementById('lessonEnd').value,
            max_students: document.getElementById('lessonMax').value
        };
        if (!payload.title || !payload.datetime_start || !payload.datetime_end) return alert('Заполните поля');
        if (!id){
            const res = await fetch('/admin/api/lesson/add', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
            if (res.ok){ bootstrap.Modal.getInstance(document.getElementById('lessonModal')).hide(); calendar.refetchEvents(); } else { const e=await res.json(); alert(e.error||'Ошибка'); }
        } else {
            const res = await fetch('/admin/api/lesson/' + id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
            if (res.ok){ bootstrap.Modal.getInstance(document.getElementById('lessonModal')).hide(); calendar.refetchEvents(); } else { const e=await res.json(); alert(e.error||'Ошибка'); }
        }
    });

    document.getElementById('deleteLessonBtn').addEventListener('click', async ()=>{
        const id = document.getElementById('lessonId').value;
        if (!id) return;
        if (!confirm('Удалить занятие?')) return;
        const res = await fetch('/admin/api/lesson/' + id, {method:'DELETE'});
        if (res.ok){ bootstrap.Modal.getInstance(document.getElementById('lessonModal')).hide(); calendar.refetchEvents(); } else { const e=await res.json(); alert(e.error||'Ошибка'); }
    });
});
</script>
{% endblock %}
