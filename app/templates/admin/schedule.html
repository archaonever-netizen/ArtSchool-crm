{% extends 'base.html' %}
{% block title %}Расписание{% endblock %}
{% block content %}
<div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:18px;">
    <div>
        <p class="label-small">Администратор</p>
        <h1 class="section-title">Расписание занятий</h1>
    </div>
    <button class="btn btn-primary" id="refreshCalendar">Обновить</button>
</div>
<div class="chart-card fullcalendar-custom" style="padding:22px;">
    <div id="calendar"></div>
</div>
<div class="modal fade" id="lessonModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="lessonModalTitle">Создать занятие</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="lessonForm">
            <input type="hidden" id="lessonId">
            <div style="display:grid; gap:18px;">
                <div>
                    <label class="label-small">Название <span class="help-icon" title="Имя занятия для календаря">?</span></label>
                    <input class="input-field" id="lessonTitle">
                </div>
                <div>
                    <label class="label-small">Тема занятия <span class="help-icon" title="Выберите шаблон урока из программы">?</span></label>
                    <select id="templateSelect" class="input-field"></select>
                </div>
                <div style="display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:18px;">
                    <div>
                        <label class="label-small">Преподаватель <span class="help-icon" title="Кто будет вести занятие">?</span></label>
                        <select id="teacherSelect" class="input-field"></select>
                    </div>
                    <div>
                        <label class="label-small">Макс. учеников <span class="help-icon" title="Максимальное количество учеников на занятии">?</span></label>
                        <input class="input-field" id="lessonMax" type="number" value="10">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:18px;">
                    <div>
                        <label class="label-small">Начало <span class="help-icon" title="Дата и время начала занятия">?</span></label>
                        <input class="input-field" id="lessonStart" type="datetime-local">
                    </div>
                    <div>
                        <label class="label-small">Конец <span class="help-icon" title="Дата и время окончания занятия">?</span></label>
                        <input class="input-field" id="lessonEnd" type="datetime-local">
                    </div>
                </div>
            </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-secondary" id="deleteLessonBtn" style="display:none">Удалить</button>
        <button type="button" class="btn btn-primary" id="saveLessonBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="attendanceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title">Список записавшихся</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div id="attendanceList" class="list-group"></div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script>
let calendar;
function formatEventTitle(lesson) {
    return `${lesson.title} • ${lesson.teacher_name || 'Без преподавателя'}`;
}
function resetLessonForm() {
    document.getElementById('lessonId').value = '';
    document.getElementById('lessonTitle').value = '';
    document.getElementById('lessonStart').value = '';
    document.getElementById('lessonEnd').value = '';
    document.getElementById('lessonMax').value = '10';
    document.getElementById('teacherSelect').value = '';
    document.getElementById('templateSelect').value = '';
    document.getElementById('deleteLessonBtn').style.display = 'none';
}
function openLessonModal(lesson = null) {
    const modal = new bootstrap.Modal(document.getElementById('lessonModal'));
    document.getElementById('lessonModalTitle').textContent = lesson ? 'Редактировать занятие' : 'Создать занятие';
    document.getElementById('lessonId').value = lesson ? lesson.id : '';
    document.getElementById('lessonTitle').value = lesson ? lesson.title : '';
    document.getElementById('lessonStart').value = lesson ? lesson.start.substring(0, 16) : '';
    document.getElementById('lessonEnd').value = lesson ? lesson.end.substring(0, 16) : '';
    document.getElementById('lessonMax').value = lesson ? lesson.max_students : 10;
    document.getElementById('teacherSelect').value = lesson ? lesson.teacher_id || '' : '';
    document.getElementById('templateSelect').value = lesson ? lesson.lesson_template_id || '' : '';
    document.getElementById('deleteLessonBtn').style.display = lesson ? 'inline-flex' : 'none';
    modal.show();
}
function renderLessonEvents(lessons) {
    return lessons.map(lesson => ({
        id: lesson.id,
        title: formatEventTitle(lesson),
        start: lesson.start,
        end: lesson.end,
        extendedProps: lesson
    }));
}
async function loadSelectData() {
    const [teachersRes, templatesRes] = await Promise.all([
        fetch('/admin/api/teachers'),
        fetch('/admin/api/lesson-templates')
    ]);
    const teachers = teachersRes.ok ? await teachersRes.json() : [];
    const templates = templatesRes.ok ? await templatesRes.json() : [];
    const teacherSelect = document.getElementById('teacherSelect');
    teacherSelect.innerHTML = '<option value="">Без преподавателя</option>' + teachers.map(t => `<option value="${t.id}">${t.full_name}</option>`).join('');
    const templateSelect = document.getElementById('templateSelect');
    templateSelect.innerHTML = '<option value="">Без шаблона</option>' + templates.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
}
async function refreshCalendar() {
    const resp = await fetch('/admin/api/lessons');
    if (!resp.ok) return;
    const lessons = await resp.json();
    calendar.removeAllEvents();
    calendar.addEventSource(renderLessonEvents(lessons));
}
async function saveLesson() {
    const id = document.getElementById('lessonId').value;
    const data = {
        title: document.getElementById('lessonTitle').value,
        lesson_template_id: document.getElementById('templateSelect').value || null,
        datetime_start: document.getElementById('lessonStart').value,
        datetime_end: document.getElementById('lessonEnd').value,
        teacher_id: document.getElementById('teacherSelect').value || null,
        max_students: document.getElementById('lessonMax').value
    };
    if (!data.title || !data.datetime_start || !data.datetime_end) {
        return alert('Заполните название и даты занятия');
    }
    const url = id ? `/admin/api/lesson/${id}` : '/admin/api/lesson/add';
    const method = id ? 'PATCH' : 'POST';
    const response = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
    if (!response.ok) {
        const result = await response.json();
        return alert(result.error || 'Ошибка сохранения занятия');
    }
    bootstrap.Modal.getInstance(document.getElementById('lessonModal')).hide();
    await refreshCalendar();
}
async function deleteLesson() {
    const id = document.getElementById('lessonId').value;
    if (!id || !confirm('Удалить занятие?')) return;
    await fetch(`/admin/api/lesson/${id}`, { method: 'DELETE' });
    bootstrap.Modal.getInstance(document.getElementById('lessonModal')).hide();
    await refreshCalendar();
}
function displayAttendance(lesson) {
    const list = document.getElementById('attendanceList');
    list.innerHTML = `<div class="list-group-item"><p class="mb-1">Количество записавшихся: ${lesson.enrolled_count || 0}</p></div>`;
    new bootstrap.Modal(document.getElementById('attendanceModal')).show();
}

function setupCalendar() {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
        selectable: true,
        selectMirror: true,
        eventClick: async info => {
            const lesson = info.event.extendedProps;
            openLessonModal(lesson);
        },
        select: selectionInfo => {
            resetLessonForm();
            document.getElementById('lessonStart').value = selectionInfo.startStr.substring(0, 16);
            document.getElementById('lessonEnd').value = selectionInfo.endStr ? selectionInfo.endStr.substring(0, 16) : selectionInfo.startStr.substring(0, 16);
            openLessonModal();
            calendar.unselect();
        }
    });
    calendar.render();
}

document.addEventListener('DOMContentLoaded', async () => {
    await loadSelectData();
    setupCalendar();
    await refreshCalendar();
    document.getElementById('refreshCalendar').addEventListener('click', refreshCalendar);
    document.getElementById('saveLessonBtn').addEventListener('click', saveLesson);
    document.getElementById('deleteLessonBtn').addEventListener('click', deleteLesson);
});
</script>
{% endblock %}
