{% extends 'base.html' %}
{% block title %}Расписание{% endblock %}
{% block content %}
<a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary btn-sm mb-3">← Назад к панели администратора</a>
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Расписание занятий</h3>
    <div>
        <button class="btn btn-primary" id="refreshCalendar">Обновить</button>
    </div>
</div>
<div id="calendar"></div>

<!-- Modal -->
<div class="modal fade" id="lessonModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lessonModalTitle">Создать занятие</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="lessonForm">
            <input type="hidden" id="lessonId">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Название <i class="bi bi-question-circle" title="Имя занятия для календаря"></i></label>
                    <input class="form-control" id="lessonTitle">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Тема занятия <i class="bi bi-question-circle" title="Выберите шаблон урока из программы"></i></label>
                    <select id="templateSelect" class="form-select"></select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Преподаватель <i class="bi bi-question-circle" title="Кто будет вести занятие"></i></label>
                    <select id="teacherSelect" class="form-select"></select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Макс. учеников <i class="bi bi-question-circle" title="Максимальное количество учеников на занятии"></i></label>
                    <input class="form-control" id="lessonMax" type="number" value="10">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Начало <i class="bi bi-question-circle" title="Дата и время начала занятия"></i></label>
                    <input class="form-control" id="lessonStart" type="datetime-local">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Конец <i class="bi bi-question-circle" title="Дата и время окончания занятия"></i></label>
                    <input class="form-control" id="lessonEnd" type="datetime-local">
                </div>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-danger" id="deleteLessonBtn" style="display:none">Удалить</button>
        <button type="button" class="btn btn-primary" id="saveLessonBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Attendance Modal -->
<div class="modal fade" id="attendanceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Список записавшихся</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="attendanceList" class="list-group"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>
let calendar;
let teachers = [];
let templates = [];

async function fetchTeachers(){
    try{
        const res = await fetch('/admin/api/teachers');
        if (res.ok) return await res.json();
    }catch(e){ console.error(e); }
    return [];
}

async function fetchTemplates(){
    try{
        const res = await fetch('/admin/api/lesson-templates');
        if (res.ok) return await res.json();
    }catch(e){ console.error(e); }
    return [];
}

function renderSelectOptions(items, element, emptyLabel){
    element.innerHTML = `<option value="">${emptyLabel}</option>`;
    items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.program_name ? `${item.title} — ${item.program_name}` : item.title;
        element.appendChild(opt);
    });
}

async function loadCalendar(){
    const calendarEl = document.getElementById('calendar');
    teachers = await fetchTeachers();
    templates = await fetchTemplates();
    renderSelectOptions(templates, document.getElementById('templateSelect'), '-- выбрать тему --');
    renderSelectOptions(teachers, document.getElementById('teacherSelect'), '-- выбрать преподавателя --');

    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        selectable: true,
        editable: false,
        events: async function(fetchInfo, successCallback, failureCallback){
            try{
                const res = await fetch('/admin/api/lessons');
                const data = await res.json();
                successCallback(data.map(item => ({
                    id: item.id,
                    title: item.lesson_template_title ? `${item.lesson_template_title}` : item.title,
                    start: item.start,
                    end: item.end,
                    extendedProps: {
                        teacher_id: item.teacher_id,
                        teacher_name: item.teacher_name,
                        enrolled_count: item.enrolled_count
                    }
                })));
            }catch(e){
                console.error(e);
                failureCallback(e);
            }
        },
        select: function(info){
            openLessonModal({start: info.startStr, end: info.endStr});
        },
        eventClick: async function(info){
            const id = info.event.id;
            openAttendanceModal(id);
        }
    });
    calendar.render();
}

function openLessonModal(data){
    const modal = new bootstrap.Modal(document.getElementById('lessonModal'));
    document.getElementById('lessonId').value = data.id || '';
    document.getElementById('lessonTitle').value = data.title || '';
    document.getElementById('templateSelect').value = data.lesson_template_id || '';
    document.getElementById('teacherSelect').value = data.teacher_id || '';
    if (data.start){
        document.getElementById('lessonStart').value = data.start.substring(0,16);
    } else {
        document.getElementById('lessonStart').value = '';
    }
    if (data.end){
        document.getElementById('lessonEnd').value = data.end.substring(0,16);
    } else {
        document.getElementById('lessonEnd').value = '';
    }
    document.getElementById('lessonMax').value = data.max_students || 10;
    document.getElementById('deleteLessonBtn').style.display = data.id ? 'inline-block' : 'none';
    modal.show();
}

async function saveLesson(){
    const id = document.getElementById('lessonId').value;
    const payload = {
        title: document.getElementById('lessonTitle').value,
        lesson_template_id: document.getElementById('templateSelect').value || null,
        teacher_id: document.getElementById('teacherSelect').value || null,
        datetime_start: document.getElementById('lessonStart').value,
        datetime_end: document.getElementById('lessonEnd').value,
        max_students: document.getElementById('lessonMax').value
    };
    if (!payload.title || !payload.datetime_start || !payload.datetime_end) {
        return alert('Заполните обязательные поля');
    }
    const url = id ? `/admin/api/lesson/${id}` : '/admin/api/lesson/add';
    const method = id ? 'PATCH' : 'POST';
    const res = await fetch(url, {method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    if (res.ok){
        bootstrap.Modal.getInstance(document.getElementById('lessonModal')).hide();
        calendar.refetchEvents();
    } else {
        const error = await res.json();
        alert(error.error || 'Ошибка при сохранении занятия');
    }
}

document.addEventListener('DOMContentLoaded', async ()=>{
    await loadCalendar();
    document.getElementById('refreshCalendar').addEventListener('click', () => calendar.refetchEvents());
    document.getElementById('saveLessonBtn').addEventListener('click', saveLesson);
    document.getElementById('deleteLessonBtn').addEventListener('click', async ()=>{
        const id = document.getElementById('lessonId').value;
        if (!id) return;
        if (!confirm('Удалить занятие?')) return;
        const res = await fetch(`/admin/api/lesson/${id}`, {method:'DELETE'});
        if (res.ok){
            bootstrap.Modal.getInstance(document.getElementById('lessonModal')).hide();
            calendar.refetchEvents();
        } else {
            const error = await res.json();
            alert(error.error || 'Ошибка при удалении занятия');
        }
    });
});

async function openAttendanceModal(lessonId){
    const res = await fetch(`/admin/api/lesson/${lessonId}/students`);
    if (!res.ok) return alert('Ошибка загрузки списка студентов');
    const data = await res.json();
    const list = document.getElementById('attendanceList');
    list.innerHTML = '';
    if (!data.length) {
        list.innerHTML = '<div class="text-muted">Нет записавшихся</div>';
    }
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'list-group-item d-flex justify-content-between align-items-center';
        div.innerHTML = `
            <div>
                <div><strong>${item.full_name || item.phone}</strong></div>
                <div class="small text-muted">${item.phone || ''}</div>
            </div>
            <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-success" data-enroll="${item.enrollment_id}" data-action="attended">Пришёл</button>
                <button class="btn btn-warning" data-enroll="${item.enrollment_id}" data-action="missed">Не пришёл</button>
            </div>
        `;
        list.appendChild(div);
    });
    const modal = new bootstrap.Modal(document.getElementById('attendanceModal'));
    modal.show();
    list.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', async ()=>{
            const enrollmentId = btn.getAttribute('data-enroll');
            const status = btn.getAttribute('data-action') === 'attended' ? 'attended' : 'missed';
            const response = await fetch(`/admin/api/lesson/${lessonId}/attendance`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({enrollment_id: enrollmentId, status})});
            if (response.ok) {
                btn.closest('.list-group-item').classList.add('opacity-50');
            } else {
                const error = await response.json();
                alert(error.error || 'Ошибка при сохранении посещаемости');
            }
        });
    });
}
</script>
{% endblock %}
