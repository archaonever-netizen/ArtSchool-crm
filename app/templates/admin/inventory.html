{% extends 'base.html' %}
{% block title %}Инвентарь{% endblock %}
{% block content %}
<div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:18px;">
    <div>
        <p class="label-small">Администратор</p>
        <h1 class="section-title">Хозяйственные заказы</h1>
    </div>
    <button class="btn btn-primary" id="addInventoryBtn">Добавить товар</button>
</div>
<div class="floating-list" id="inventoryList"></div>
<div class="modal fade" id="inventoryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="inventoryModalTitle">Добавить товар</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="inventoryForm" style="display:grid; gap:18px;">
            <input type="hidden" id="inventoryId">
            <div>
                <label class="label-small">Название <span class="help-icon" title="Название хозяйственного товара">?</span></label>
                <input type="text" id="inventoryName" class="input-field" required>
            </div>
            <div>
                <label class="label-small">Текущее количество <span class="help-icon" title="Текущее количество товара на складе">?</span></label>
                <input type="number" id="inventoryCurrent" class="input-field" step="0.01" required>
            </div>
            <div>
                <label class="label-small">Минимальный запас <span class="help-icon" title="Минимальный запас, при котором нужно пополнить товар">?</span></label>
                <input type="number" id="inventoryMin" class="input-field" step="0.01" required>
            </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" id="saveInventoryBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadInventory(){
    const res = await fetch('/admin/api/inventory');
    if (!res.ok) return;
    const items = await res.json();
    const container = document.getElementById('inventoryList');
    container.innerHTML = '';
    items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'floating-row';
        row.innerHTML = `
            <div class="row-meta"><p class="row-title">${item.name}</p><p class="row-subtitle">Текущее: ${item.current_quantity} · Мин.: ${item.min_quantity}</p></div>
            <div class="row-actions"><button class="btn btn-secondary btn-sm" data-id="${item.id}" data-action="edit">Ред.</button><button class="btn btn-secondary btn-sm" data-id="${item.id}" data-action="delete">Удалить</button></div>
        `;
        container.appendChild(row);
    });
}
function openInventoryModal(item = null){
    document.getElementById('inventoryModalTitle').textContent = item ? 'Редактировать товар' : 'Добавить товар';
    document.getElementById('inventoryId').value = item ? item.id : '';
    document.getElementById('inventoryName').value = item ? item.name : '';
    document.getElementById('inventoryCurrent').value = item ? item.current_quantity : '';
    document.getElementById('inventoryMin').value = item ? item.min_quantity : '';
    new bootstrap.Modal(document.getElementById('inventoryModal')).show();
}
async function saveInventoryItem(){
    const id = document.getElementById('inventoryId').value;
    const payload = {
        name: document.getElementById('inventoryName').value,
        current_quantity: parseFloat(document.getElementById('inventoryCurrent').value) || 0,
        min_quantity: parseFloat(document.getElementById('inventoryMin').value) || 0
    };
    if (!payload.name) return alert('Введите название товара');
    const url = id ? `/admin/api/inventory/${id}` : '/admin/api/inventory';
    const method = id ? 'PATCH' : 'POST';
    const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('inventoryModal')).hide(); await loadInventory(); }
    else { const error = await res.json(); alert(error.error || 'Ошибка'); }
}

document.addEventListener('DOMContentLoaded', ()=>{
    loadInventory();
    document.getElementById('addInventoryBtn').addEventListener('click', ()=>openInventoryModal());
    document.getElementById('saveInventoryBtn').addEventListener('click', saveInventoryItem);
    document.getElementById('inventoryList').addEventListener('click', async (event)=>{
        const btn = event.target.closest('button');
        if (!btn) return;
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'edit') {
            const res = await fetch(`/admin/api/inventory/${id}`);
            if (!res.ok) return alert('Товар не найден');
            const item = await res.json();
            openInventoryModal(item);
        }
        if (action === 'delete') {
            if (!confirm('Удалить товар?')) return;
            const res = await fetch(`/admin/api/inventory/${id}`, { method:'DELETE' });
            if (res.ok) loadInventory(); else { const error = await res.json(); alert(error.error || 'Ошибка'); }
        }
    });
});
</script>
{% endblock %}
