{% extends 'base.html' %}
{% block title %}Хозяйственные заказы{% endblock %}
{% block content %}
<a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary btn-sm mb-3">← Назад к панели администратора</a>
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Хозяйственные заказы</h3>
    <button class="btn btn-primary" id="addInventoryBtn">Добавить товар</button>
</div>
<div class="table-responsive">
    <table class="table table-striped" id="inventoryTable">
        <thead>
            <tr>
                <th>Название</th>
                <th>Текущее</th>
                <th>Мин. запас</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="modal fade" id="inventoryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="inventoryModalTitle">Добавить товар</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="inventoryForm">
            <input type="hidden" id="inventoryId">
            <div class="mb-3">
                <label class="form-label">Название <i class="bi bi-question-circle" title="Название хозяйственного товара"></i></label>
                <input type="text" id="inventoryName" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Текущее количество <i class="bi bi-question-circle" title="Текущее количество товара на складе"></i></label>
                <input type="number" id="inventoryCurrent" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Минимальный запас <i class="bi bi-question-circle" title="Минимальный запас, при котором нужно пополнить товар"></i></label>
                <input type="number" id="inventoryMin" class="form-control" step="0.01" required>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" id="saveInventoryBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadInventory() {
    const res = await fetch('/admin/api/inventory');
    if (!res.ok) return;
    const items = await res.json();
    const tbody = document.querySelector('#inventoryTable tbody');
    tbody.innerHTML = '';
    items.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.current_quantity}</td>
            <td>${item.min_quantity}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary me-1" data-id="${item.id}" data-action="edit">Ред.</button>
                <button class="btn btn-sm btn-outline-danger" data-id="${item.id}" data-action="delete">Удалить</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function openInventoryModal(item = null) {
    const modal = new bootstrap.Modal(document.getElementById('inventoryModal'));
    document.getElementById('inventoryModalTitle').textContent = item ? 'Редактировать товар' : 'Добавить товар';
    document.getElementById('inventoryId').value = item ? item.id : '';
    document.getElementById('inventoryName').value = item ? item.name : '';
    document.getElementById('inventoryCurrent').value = item ? item.current_quantity : '';
    document.getElementById('inventoryMin').value = item ? item.min_quantity : '';
    modal.show();
}

async function saveInventoryItem() {
    const id = document.getElementById('inventoryId').value;
    const payload = {
        name: document.getElementById('inventoryName').value,
        current_quantity: parseFloat(document.getElementById('inventoryCurrent').value) || 0,
        min_quantity: parseFloat(document.getElementById('inventoryMin').value) || 0
    };
    if (!payload.name) {
        return alert('Введите название товара');
    }
    const url = id ? `/admin/api/inventory/${id}` : '/admin/api/inventory';
    const method = id ? 'PATCH' : 'POST';
    const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('inventoryModal')).hide();
        await loadInventory();
    } else {
        const error = await res.json();
        alert(error.error || 'Ошибка при сохранении');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadInventory();
    const inventoryModal = new bootstrap.Modal(document.getElementById('inventoryModal'));

    document.getElementById('addInventoryBtn').addEventListener('click', () => openInventoryModal());
    document.getElementById('saveInventoryBtn').addEventListener('click', saveInventoryItem);

    document.querySelector('#inventoryTable').addEventListener('click', async (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const id = button.getAttribute('data-id');
        const action = button.getAttribute('data-action');
        if (action === 'edit') {
            const res = await fetch(`/admin/api/inventory/${id}`);
            if (!res.ok) return alert('Товар не найден');
            const item = await res.json();
            openInventoryModal(item);
        }
        if (action === 'delete') {
            if (!confirm('Удалить товар?')) return;
            const res = await fetch(`/admin/api/inventory/${id}`, { method: 'DELETE' });
            if (res.ok) {
                await loadInventory();
            } else {
                const error = await res.json();
                alert(error.error || 'Ошибка при удалении');
            }
        }
    });
});
</script>
{% endblock %}
