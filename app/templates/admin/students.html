{% extends 'base.html' %}
{% block title %}Студенты{% endblock %}
{% block content %}
<div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:18px;">
    <div>
        <p class="label-small">Администратор</p>
        <h1 class="section-title">Ученики</h1>
    </div>
    <button class="btn btn-primary" id="addStudentBtn">Добавить ученика</button>
</div>
<div class="floating-list" id="studentsList"></div>
<div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="studentModalTitle">Добавить студента</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="studentForm">
            <input type="hidden" id="studentId">
            <div style="margin-bottom:18px;"><label class="label-small">Имя <span class="help-icon" title="Полное имя ученика">?</span></label><input type="text" id="fullName" class="input-field"></div>
            <div style="margin-bottom:18px;"><label class="label-small">Телефон <span class="help-icon" title="Телефон используется как логин">?</span></label><input type="text" id="phone" class="input-field"></div>
            <div style="margin-bottom:18px;"><label class="label-small">Тариф <span class="help-icon" title="Выберите тариф для ученика">?</span></label><select id="tariffSelect" class="input-field"></select></div>
            <div style="margin-bottom:18px;"><label class="label-small">Начальное количество занятий <span class="help-icon" title="Сколько занятий у ученика изначально">?</span></label><input type="number" id="initialLessons" class="input-field" value="0"></div>
            <div style="margin-bottom:18px;" id="passwordRow"><label class="label-small">Пароль <span class="help-icon" title="Пароль для входа ученика">?</span></label><input type="password" id="password" class="input-field"></div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        <button type="button" class="btn btn-primary" id="saveStudentBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function fetchStudents(){
    const res = await fetch('/admin/api/students');
    const data = await res.json();
    const container = document.getElementById('studentsList');
    container.innerHTML = '';
    data.forEach(s => {
        const card = document.createElement('div');
        card.className = 'floating-row';
        card.innerHTML = `
            <div class="row-meta">
                <p class="row-title">${s.full_name || 'Без имени'}</p>
                <p class="row-subtitle">Телефон: ${s.phone} · Тариф: ${s.tariff || '—'}</p>
            </div>
            <div class="row-actions">
                <button class="btn btn-secondary btn-sm" data-id="${s.id}" data-action="edit">Ред.</button>
                <button class="btn btn-secondary btn-sm" data-id="${s.id}" data-action="delete">Удалить</button>
            </div>
        `;
        container.appendChild(card);
    });
}
async function fetchTariffs(){
    const res = await fetch('/admin/api/tariffs');
    const data = await res.json();
    const sel = document.getElementById('tariffSelect');
    sel.innerHTML = '<option value="">-- без тарифа --</option>';
    data.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = `${t.name} (${t.lessons_count} зан., ${t.price} руб.)`;
        sel.appendChild(opt);
    });
}

function openStudentModal(student = null){
    document.getElementById('studentModalTitle').textContent = student ? 'Редактировать студента' : 'Добавить студента';
    document.getElementById('studentId').value = student ? student.id : '';
    document.getElementById('fullName').value = student ? student.full_name : '';
    document.getElementById('phone').value = student ? student.phone : '';
    document.getElementById('tariffSelect').value = student ? student.tariff_id || '' : '';
    document.getElementById('initialLessons').value = student ? student.lessons_remaining || 0 : 0;
    document.getElementById('passwordRow').style.display = student ? 'none' : 'block';
    new bootstrap.Modal(document.getElementById('studentModal')).show();
}

async function saveStudent() {
    const id = document.getElementById('studentId').value;
    const payload = {
        full_name: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value,
        tariff_id: document.getElementById('tariffSelect').value || null,
        initial_lessons: document.getElementById('initialLessons').value,
        password: document.getElementById('password').value
    };
    if (!payload.phone) { alert('Телефон обязателен'); return; }
    const url = id ? `/admin/api/students/${id}` : '/admin/api/students';
    const method = id ? 'PATCH' : 'POST';
    const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide();
        await fetchStudents();
    } else {
        const error = await res.json();
        alert(error.error || 'Ошибка');
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    await fetchTariffs();
    await fetchStudents();
    document.getElementById('addStudentBtn').addEventListener('click', () => openStudentModal());
    document.getElementById('saveStudentBtn').addEventListener('click', saveStudent);
    document.getElementById('studentsList').addEventListener('click', async (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const id = button.dataset.id;
        const action = button.dataset.action;
        if (action === 'edit') {
            const res = await fetch('/admin/api/students');
            const data = await res.json();
            const student = data.find(item => item.id == id);
            openStudentModal(student);
        }
        if (action === 'delete') {
            if (!confirm('Удалить студента?')) return;
            const res = await fetch(`/admin/api/students/${id}`, { method: 'DELETE' });
            if (res.ok) await fetchStudents(); else { const error= await res.json(); alert(error.error || 'Ошибка'); }
        }
    });
});
</script>
{% endblock %}
